<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Удостоверение личности</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#fff;color:#191919;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,label:focus-within{outline:3px solid #8ab4ff;outline-offset:3px}.app{max-width:480px;margin:auto;height:100svh;min-height:560px;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}.header{height:65px;flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative;padding:0 44px}.header h1{font-size:18px;font-weight:650;margin:0;white-space:nowrap;letter-spacing:-.35px}.back{position:absolute;left:13px;top:17px;background:none;border:0;padding:7px;color:#202020}.back svg{width:20px;height:24px;display:block}.tabs{display:flex;background:#f1f1f1;border-radius:12px;margin:8px 16px 0;padding:3px;min-height:39px;flex-shrink:0}.tab{width:50%;border:0;background:transparent;border-radius:10px;font-size:16px;color:#181818}.tab[aria-selected="true"]{background:#fff;box-shadow:0 1px 5px #00000009}.content{flex:1;min-height:0;padding:19px 28px 24px;display:flex}.document{position:relative;display:block;width:100%;height:100%;background:#fff;overflow:hidden;cursor:pointer}.document input{position:absolute;width:1px;height:1px;opacity:0}.document img{width:100%;height:100%;object-fit:contain;display:block}.document img:not([src]){display:none}.document{display:flex;flex-direction:column}.file-preview{flex:1;min-height:0;position:relative}.file-preview img,.file-preview iframe{width:100%;height:100%;border:0;background:white}.file-preview img{position:absolute;inset:0;object-fit:contain;object-position:center;cursor:pointer}.file-preview iframe{position:absolute;inset:0}.file-error{font-size:14px;line-height:1.5;color:#666;padding:16px}.file-picker{position:absolute;inset:0;width:100%;border:0;background:white;cursor:pointer}.details{margin:0;width:100%;background:#f5f5f5;padding:20px;border-radius:12px;color:#666;font-size:15px;line-height:1.5}.actions{border-top:1px solid #f2f2f2;padding:19px 19px calc(23px + env(safe-area-inset-bottom));display:grid;gap:12px;flex-shrink:0}.action{width:100%;min-height:58px;border-radius:13px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:18px;font-weight:500;letter-spacing:-.2px}.action svg{width:25px;height:27px;flex-shrink:0}.primary{background:#3578d4;border:1px solid #3578d4;color:white}.secondary{background:white;border:1.5px solid #93a2b9;color:#455b78}.action:active{filter:brightness(.95)}[hidden]{display:none!important}dialog{border:0;border-radius:20px;padding:28px;max-width:calc(100% - 40px);width:340px;color:#191919}dialog::backdrop{background:#0008}dialog h2{font-size:20px;margin:0 0 16px}dialog p{line-height:1.5;color:#666}dialog button{padding:12px;width:100%;border:0;border-radius:10px;background:#3578d4;color:#fff}.notice{font-size:14px;text-align:center;color:#666;margin:0 0 10px}@media(min-width:600px){body{background:#f3f4f6}.app{background:white;box-shadow:0 0 30px #00000008}}@media(max-height:650px){.header{height:54px}.content{padding-top:14px;padding-bottom:16px}.actions{padding-top:14px;padding-bottom:14px}.action{min-height:52px}}
</style>
</head>
<body>
<main class="app">
<header class="header"><button class="back" aria-label="Назад"><svg viewBox="0 0 24 28" fill="none"><path d="M17 3 6 14l11 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><h1>Удостоверение личности</h1></header>
<div class="tabs" role="tablist" aria-label="Просмотр документа"><button class="tab" id="document-tab" role="tab" aria-selected="true" aria-controls="document-panel">Документ</button><button class="tab" id="details-tab" role="tab" aria-selected="false" aria-controls="details-panel" tabindex="-1">Реквизиты</button></div>
<section class="content" id="document-panel" role="tabpanel" aria-labelledby="document-tab"><div class="document"><input type="file" id="document-file" accept="image/*,application/pdf,.pdf,.png,.jpg,.jpeg,.webp,.gif,.bmp,.avif,.heic,.heif,.tif,.tiff"><div class="file-preview"><button class="file-picker" id="choose-document" aria-label="Выбрать изображение или PDF"></button><img id="document-image" alt="Выбранное изображение документа" hidden><iframe id="document-pdf" title="Просмотр PDF" hidden></iframe><p class="file-error" id="file-error" role="status" hidden>Этот формат не отображается в браузере. Нажмите здесь и выберите PNG, JPG либо PDF.</p></div></div></section>
<section class="content" id="details-panel" role="tabpanel" aria-labelledby="details-tab" hidden><p class="details">Реквизиты документа не добавлены.</p></section>
<footer class="actions"><button class="action primary" id="present"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M9 3H3v6m16-6h6v6M3 19v6h6m16-6v6h-6"/><path d="M7 7h5v5H7zm9 0h5v5h-5zM7 16h5v5H7zm9 0h3v3h-3zm5 3v3h-5m5-8h3m-10 0v3"/></svg>Предъявить документ</button><button class="action secondary" id="share"><svg viewBox="0 0 28 30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 19V2m-5 5 5-5 5 5M8 12H6a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h16a3 3 0 0 0 3-3V15a3 3 0 0 0-3-3h-2"/></svg>Отправить документ</button></footer>
</main>
<dialog id="present-dialog"><h2>Предъявить документ</h2><p>Это локальный макет интерфейса. Проверка документа недоступна.</p><button id="close-dialog">Закрыть</button></dialog>
<script>
const tabs=[...document.querySelectorAll('.tab')];
function selectTab(index){tabs.forEach((tab,i)=>{tab.setAttribute('aria-selected',String(i===index));tab.tabIndex=i===index?0:-1;document.getElementById(tab.getAttribute('aria-controls')).hidden=i!==index;});}
tabs.forEach((tab,i)=>{tab.addEventListener('click',()=>selectTab(i));tab.addEventListener('keydown',event=>{if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();const next=1-i;selectTab(next);tabs[next].focus();}});});
let selectedFile,imageUrl;
const picker=document.getElementById('document-file');
const previewImage=document.getElementById('document-image');
const previewPdf=document.getElementById('document-pdf');
const fileError=document.getElementById('file-error');
const chooseDocument=document.getElementById('choose-document');
chooseDocument.addEventListener('click',()=>picker.click());
previewImage.addEventListener('click',()=>picker.click());
fileError.addEventListener('click',()=>picker.click());
// Double tap the Document tab to replace a PDF without extra controls.
document.getElementById('document-tab').addEventListener('dblclick',()=>picker.click());
previewImage.addEventListener('error',()=>{previewImage.hidden=true;fileError.hidden=false;});
function displayFile(file){
 if(!file)return false;
 const isPdf=file.type==='application/pdf'||/\.pdf$/i.test(file.name);
 const isImage=file.type.startsWith('image/')||/\.(png|jpe?g|webp|gif|bmp|avif|heic|heif|tiff?|svg)$/i.test(file.name);
 if(!isPdf&&!isImage){alert('Выберите изображение или PDF.');picker.value='';return false;}
 previewImage.hidden=true;previewImage.removeAttribute('src');previewPdf.hidden=true;previewPdf.removeAttribute('src');fileError.hidden=true;
 if(imageUrl)URL.revokeObjectURL(imageUrl);
 selectedFile=file;imageUrl=URL.createObjectURL(file);
 chooseDocument.hidden=true;
 if(isPdf){previewPdf.src=imageUrl;previewPdf.hidden=false;}else{previewImage.src=imageUrl;previewImage.hidden=false;}
 return true;
}
let storage;
function documentStore(){
 if(!storage)storage=new Promise((resolve,reject)=>{
  const request=indexedDB.open('document-preview-files',1);
  request.onupgradeneeded=()=>request.result.createObjectStore('files');
  request.onsuccess=()=>resolve(request.result);
  request.onerror=()=>reject(request.error);
 });
 return storage;
}
async function saveFile(file){
 const db=await documentStore();
 await new Promise((resolve,reject)=>{
  const tx=db.transaction('files','readwrite');tx.objectStore('files').put(file,'selected');
  tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);
 });
}
picker.addEventListener('change',event=>{
 const file=event.target.files[0];
 if(displayFile(file))saveFile(file).catch(()=>alert('Не удалось сохранить файл на телефоне. Освободите место и выберите его снова.'));
 picker.value='';
});
(async()=>{
 try{
  const db=await documentStore();
  const file=await new Promise((resolve,reject)=>{const r=db.transaction('files').objectStore('files').get('selected');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});
  if(!selectedFile&&file)displayFile(file);
 }catch(error){console.warn('Local document storage unavailable',error);}
})();
const modal=document.getElementById('present-dialog');document.getElementById('present').addEventListener('click',()=>modal.showModal());document.getElementById('close-dialog').addEventListener('click',()=>modal.close());modal.addEventListener('click',event=>{if(event.target===modal){const r=modal.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)modal.close();}});
document.querySelector('.back').addEventListener('click',()=>selectTab(0));
document.getElementById('share').addEventListener('click',async()=>{if(!selectedFile){document.getElementById('document-file').click();return;}try{if(navigator.canShare&&navigator.canShare({files:[selectedFile]})){await navigator.share({files:[selectedFile]});}else{const link=document.createElement('a');link.href=imageUrl;link.download=selectedFile.name;link.click();}}catch(error){if(error.name!=='AbortError')console.error(error);}});
</script>
</body>
</html>
